; claude-dictate settings. dictate-start.ahk copies this file to dictate.ini on
; first run; edit dictate.ini, then Reload from the tray / indicator menu.

[profiles]
; A profile is a Claude config directory (CLAUDE_CONFIG_DIR) that holds a
; .credentials.json; "default" is Claude Code's own ~\.claude.
; dir  = parent folder whose subfolders are profiles; they appear in the tray
;        menu. Empty = your user folder, which finds the usual ~\.claude-work,
;        ~\.claude-personal style profiles. Set on the first run from the
;        folder you pick in the dialog, e.g. dir=C:\claude-profiles for
;          C:\claude-profiles\john\.credentials.json
;          C:\claude-profiles\jane\.credentials.json
; last = written automatically: the profile used last time (empty = default).
;        Switch profiles any time from the tray menu.
dir=
last=

[settings]
; Path to claude.exe. Empty = find it in PATH (or ~\.local\bin\claude.exe).
;   claudeExe=C:\Users\john\.local\bin\claude.exe
claudeExe=

; Hotkeys in AutoHotkey notation: ^ Ctrl, + Shift, ! Alt, # Win, then the key
; name, e.g. ^Space, ^!d, #v, F9. hotkey starts a recording and, pressed again,
; stops it and pastes; cancelKey aborts and is active only while recording.
hotkey=^Space
cancelKey=Escape

; How the Claude Code console window is shown: hidden | minimized | visible.
; Can also be switched at run time from the tray / indicator menu.
windowMode=minimized

; Recording countdown in seconds. Claude Code stops and submits a recording
; by itself after two minutes, so the countdown is informational: green, red
; for the last recWarnSec seconds, then negative. Only if Claude Code has not
; stopped by recForceStopAt (e.g. -15 = 15 s past zero) the script stops it.
recLimitSec=120
recWarnSec=10
recForceStopAt=-15

; Status indicator: top-left corner as percent of the primary monitor's work
; area (0 = left/top, 100 = right/bottom). Dragging the indicator with the
; mouse overrides this (saved in the [indicator] section below).
indicatorXPercent=90
indicatorYPercent=90
; Opacity 0..255 and 1 px border colour as 0xBBGGRR.
indicatorOpacity=170
indicatorBorder=0x909090